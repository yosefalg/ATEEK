name: ATEEK 2.2 Android APK

on:
  workflow_dispatch:
  push:
    branches: [production-ready-2.2]
    paths-ignore: ['assets/generated/**']

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin openssl
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png
          test -s assets/generated/adaptive-icon.png
          test -s assets/generated/splash.png

      - name: Embed build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} (#${VERSION_CODE}) commit ${SHORT_SHA}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight and apply production transforms
        run: |
          node scripts/run74-reels-transform.mjs
          node scripts/run76-reels-transform.mjs
          node scripts/run77-reels-transform.mjs
          grep -Fq 'ATEEK AI' src/screens/AIAssistantScreen.tsx
          grep -Fq 'const sendImage = async' src/components/SpatialDealScreens.tsx
          grep -Fq 'cloudinaryVideoThumbnail' src/components/SafeReelVideo.tsx
          grep -Fq 'particleSeed' src/components/DynamicBackground.tsx

      - name: Validate ATEEK 2.2 contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.2.0'||a.android.versionCode!==16||a.jsEngine!=='hermes'||a.android.softwareKeyboardLayoutMode!=='resize')process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='apk'||e.build.production.distribution!=='internal')process.exit(1)"
          grep -Fq '#0A0E17' src/theme/tokens.ts
          grep -Fq '#6C8DFF' src/theme/tokens.ts
          grep -Fq '#A78BFA' src/theme/tokens.ts
          grep -Fq 'Gyroscope' src/components/DynamicBackground.tsx
          grep -Fq 'LinearGradient' src/components/DynamicBackground.tsx
          grep -Fq "behavior={Platform.OS === 'ios' ? 'padding' : 'height'}" src/screens/AddListingScreen.tsx

      - name: TypeScript strict check
        run: npm run typecheck

      - name: i18n quality gate
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Apply native hardening and enforce adjustResize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=Path('android/app/src/main/res/xml/network_security_config.xml')
          gradle=Path('android/app/build.gradle')
          props=Path('android/gradle.properties')
          s=manifest.read_text()
          s=re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"','',s)
          s=re.sub(r'\sandroid:networkSecurityConfig="[^"]*"','',s)
          s=re.sub(r'android:windowSoftInputMode="[^"]*"','android:windowSoftInputMode="adjustResize"',s)
          s=s.replace('<application','<application android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config"',1)
          manifest.write_text(s)
          xml.parent.mkdir(parents=True,exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n')
          p=props.read_text()
          p=re.sub(r'^android\.bundle\.enableUncompressedNativeLibs=.*\n?','',p,flags=re.M)
          props.write_text(p)
          g=gradle.read_text()
          if 'hermesFlags = ["-O", "-output-source-map"]' not in g:
              g=g.replace('react {','react {\n    hermesFlags = ["-O", "-output-source-map"]',1)
          marker='android {'
          block='''android {\n    packagingOptions {\n        jniLibs {\n            pickFirsts += ["**/libc++_shared.so"]\n            excludes += ["**/libjsc.so", "**/libjscexecutor.so"]\n        }\n    }'''
          if 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' not in g:
              g=g.replace(marker,block,1)
          gradle.write_text(g)
          PY
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Eq 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml

      - name: Build arm64 installable APK only
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify APK identity ABI and no AAB
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          echo "$BADGING" | grep -Eq "versionCode='16'.*versionName='2\.2\.0'|versionName='2\.2\.0'.*versionCode='16'"
          APK_ABIS="$(unzip -Z1 "$APK_PATH" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          [ "$APK_ABIS" = "arm64-v8a " ]
          ! unzip -Z1 "$APK_PATH" | grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$'
          sha256sum "$APK_PATH"

      - name: Generate APKANALYZER metrics and enforce 35 MiB budget
        run: |
          set -euo pipefail
          mkdir -p metrics-out
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APK_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=$((35*1024*1024))
          if [ "$APK_BYTES" -gt "$MAX_BYTES" ]; then echo "APK exceeds 35 MiB target: $APK_BYTES"; exit 1; fi
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          ABI="$(unzip -Z1 "$APK_PATH" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          printf 'ATEEK 2.2 APK PRODUCTION METRICS\nAPK bytes=%s\nSHA-256=%s\nABI=%s\nAAB production=DISABLED\nPhysical Android device test=NOT PERFORMED BY CI\n' "$APK_BYTES" "$SHA" "$ABI" > metrics-out/METRICS.txt
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK_ANALYZER" ]; then
            {
              echo '=== APK SUMMARY ==='
              "$APK_ANALYZER" apk summary "$APK_PATH" || true
              echo '=== APK FILES ==='
              "$APK_ANALYZER" files list "$APK_PATH" || true
              echo '=== DEX PACKAGES ==='
              "$APK_ANALYZER" dex packages "$APK_PATH" || true
            } > metrics-out/APKANALYZER.txt
          else
            echo 'apkanalyzer not found on runner' > metrics-out/APKANALYZER.txt
          fi
          cat metrics-out/METRICS.txt

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-2.2-INSTALLABLE-APK-ARM64
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-2.2-PRODUCTION-METRICS
          path: metrics-out/*
          if-no-files-found: error
          retention-days: 30
