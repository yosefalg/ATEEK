name: ATEEK Android Production

on:
  workflow_dispatch:
  push:
    branches: [production-ready-2.1]
    paths-ignore: ['assets/generated/**']
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and verify ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin openssl
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png && test -s assets/generated/adaptive-icon.png && test -s assets/generated/splash.png
      - name: Embed exact build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} Play (#${VERSION_CODE}) commit ${SHORT_SHA}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.1.0'||a.android.versionCode!==15||a.jsEngine!=='hermes')process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='app-bundle'||e.build.production.distribution!=='store')process.exit(1)"
          grep -Fq "ScreenErrorBoundary name=\"Chat\"" src/cloud/OnlineApp.tsx
          grep -Fq "SafeReelVideo" src/components/SpatialReelsHub.tsx
          grep -Fq "ateek_verification_request_submit" supabase/migrations/20260906193000_production_ready_v21.sql
          grep -Fq "#090A0F" src/theme/tokens.ts
          grep -Fq 'esModuleInterop' tsconfig.json
          grep -Fq 'drop_console' metro.config.js
          grep -Fq 'AsyncStorage.multiGet' src/theme/ThemeProvider.tsx
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Apply Run 72 native trim and hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          manifest=root/'android/app/src/main/AndroidManifest.xml'
          xml=root/'android/app/src/main/res/xml/network_security_config.xml'
          gradle=root/'android/app/build.gradle'
          props=root/'android/gradle.properties'
          s=manifest.read_text()
          s=re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"','',s)
          s=re.sub(r'\sandroid:networkSecurityConfig="[^"]*"','',s)
          s=s.replace('<application','<application android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config"',1)
          manifest.write_text(s)
          xml.parent.mkdir(parents=True,exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n')
          p=props.read_text()
          p=re.sub(r'^android\.bundle\.enableUncompressedNativeLibs=.*\n?','',p,flags=re.M)
          props.write_text(p)
          g=gradle.read_text()
          if 'hermesFlags = ["-O", "-output-source-map"]' not in g:
              g=g.replace('react {','react {\n    hermesFlags = ["-O", "-output-source-map"]',1)
          marker='android {'
          block='''android {\n    packagingOptions {\n        jniLibs {\n            pickFirsts += ["**/libc++_shared.so"]\n            excludes += ["**/libjsc.so", "**/libjscexecutor.so"]\n        }\n    }'''
          if 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' not in g:
              g=g.replace(marker,block,1)
          gradle.write_text(g)
          print('Run #72 native trim applied: Hermes -O, JSC excludes, libc++ pickFirst, cleartext off, system trust only.')
          PY
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -Fq '<certificates src="system" />' android/app/src/main/res/xml/network_security_config.xml
          ! grep -q '^android.bundle.enableUncompressedNativeLibs=' android/gradle.properties
          grep -Fq 'hermesFlags = ["-O", "-output-source-map"]' android/app/build.gradle
          grep -Fq '**/libjsc.so' android/app/build.gradle
      - name: Audit certificate expiry and SPKI candidates
        run: |
          set -euo pipefail
          mkdir -p metrics-out
          : > metrics-out/CERTIFICATE-AUDIT.txt
          for HOST in aoftmiajhujveahjqlct.supabase.co res.cloudinary.com; do
            echo "HOST=$HOST" | tee -a metrics-out/CERTIFICATE-AUDIT.txt
            openssl s_client -showcerts -servername "$HOST" -connect "$HOST:443" </dev/null 2>/dev/null > "/tmp/${HOST}.chain"
            awk '/BEGIN CERTIFICATE/{n++}{print > ("/tmp/cert" n ".pem")}' "/tmp/${HOST}.chain"
            LEAF=/tmp/cert1.pem
            END=$(openssl x509 -in "$LEAF" -noout -enddate | cut -d= -f2-)
            END_EPOCH=$(date -d "$END" +%s)
            NOW=$(date +%s)
            LEFT=$(( (END_EPOCH-NOW)/86400 ))
            echo "daysRemaining=$LEFT" | tee -a metrics-out/CERTIFICATE-AUDIT.txt
            [ "$LEFT" -gt 7 ]
            PIN=$(openssl x509 -in "$LEAF" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | openssl dgst -sha256 -binary | openssl base64 -A)
            echo "leafSPKI=sha256/$PIN" | tee -a metrics-out/CERTIFICATE-AUDIT.txt
            rm -f /tmp/cert*.pem
          done
          echo 'Runtime pinning intentionally not enabled until two out-of-band verified backup SPKI pins per host are supplied; CI records live candidates and fails on <=7 certificate days.' | tee -a metrics-out/CERTIFICATE-AUDIT.txt
      - name: Build full Play AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Build arm64 installable APK
        env:
          IS_INSTALLABLE_APK: 'true'
        run: |
          cd android
          echo "IS_INSTALLABLE_APK=${IS_INSTALLABLE_APK}"
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Verify exact Android identity and ABI contract
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          EXPECTED_VERSION_NAME="2.1.0"
          EXPECTED_VERSION_CODE="15"
          EXPECTED_SHORT_SHA="${GITHUB_SHA::7}"
          test -s "$APK_PATH" && test -s "$AAB_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -t "$AAB_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
          [ "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME" ]
          [ "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE" ]
          APK_ABIS="$(unzip -Z1 "$APK_PATH" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          echo "APK ABIs: $APK_ABIS"
          [ "$APK_ABIS" = "arm64-v8a " ]
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do unzip -Z1 "$AAB_PATH" | grep -q "^base/lib/${ABI}/"; done
          ! unzip -Z1 "$APK_PATH" | grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$'
          echo "VERIFIED RUN72: ${ACTUAL_VERSION_NAME} #${ACTUAL_VERSION_CODE} ${EXPECTED_SHORT_SHA}"
          sha256sum "$AAB_PATH" "$APK_PATH"
      - name: Generate Run 72 APK metrics and largest files
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p metrics-out
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK_ANALYZER" ]; then
            "$APK_ANALYZER" apk summary "$APK_PATH" > metrics-out/APKANALYZER.txt || true
            "$APK_ANALYZER" files list "$APK_PATH" >> metrics-out/APKANALYZER.txt || true
          fi
          python - <<'PY'
          import gzip,json,os,zipfile
          apk='android/app/build/outputs/apk/release/app-release.apk'
          baseline=json.load(open('metrics/run64-baseline.json'))
          with zipfile.ZipFile(apk) as z:
              infos=z.infolist()
              top=sorted(((i.file_size,i.compress_size,i.filename) for i in infos), reverse=True)[:10]
              arm=sum(i.file_size for i in infos if i.filename.startswith('lib/arm64-v8a/'))
              js=None
              for i in infos:
                  if i.filename.startswith('assets/') and ('index.android.bundle' in i.filename or i.filename.endswith('.hbc')):
                      data=z.read(i.filename); js={'path':i.filename,'bytes':len(data),'gzipBytes':len(gzip.compress(data,9))}
                      break
          apk_bytes=os.path.getsize(apk)
          out={'run64Baseline':baseline,'run72':{'apkBytes':apk_bytes,'arm64NativeBytes':arm,'jsBundle':js,'largest10':[{'path':p,'rawBytes':r,'compressedBytes':c} for r,c,p in top]}}
          open('metrics-out/bundle-size.json','w').write(json.dumps(out,indent=2))
          with open('metrics-out/METRICS.txt','w') as f:
              f.write(f'ATEEK RUN #72 METRICS\nAPK bytes: {apk_bytes}\narm64 native raw bytes: {arm}\n')
              if js: f.write(f"Hermes bundle raw: {js['bytes']} gzip: {js['gzipBytes']}\n")
              f.write('Largest 10 files:\n')
              for r,c,p in top: f.write(f'{r:>10} raw {c:>10} compressed {p}\n')
              f.write('Physical Android 8/2GB TotalTime/PSS: NOT MEASURED; no physical device is attached to GitHub Actions.\n')
          print(open('metrics-out/METRICS.txt').read())
          if arm > 16_000_000:
              raise SystemExit(f'arm64 native payload exceeds 16MB guard: {arm}')
          PY
      - name: Comment metrics on pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            { echo '### ATEEK Run #72 size/security metrics'; echo '```'; cat metrics-out/METRICS.txt; echo '```'; echo; cat metrics-out/CERTIFICATE-AUDIT.txt; } > /tmp/pr-comment.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md
          fi
      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ATEEK-PLAY-RELEASE.aab
          cp android/app/build/outputs/apk/release/app-release.apk ATEEK-2.1.0-BUILD15-ARM64.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-PLAY-AAB
          path: ATEEK-PLAY-RELEASE.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-INSTALLABLE-APK-ARM64
          path: ATEEK-2.1.0-BUILD15-ARM64.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Run 72 metrics
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-RUN72-METRICS
          path: metrics-out/*
          if-no-files-found: error
          retention-days: 30
