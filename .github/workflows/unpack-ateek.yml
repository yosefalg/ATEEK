name: ATEEK Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/generated/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png

      - name: Persist generated branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if ! git diff --cached --quiet; then
            git commit -m "Generate ATEEK app branding assets"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release package
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          unzip -l "$APK_PATH" | grep -Eq 'index\.android\.bundle|assets/.+\.bundle' || {
            echo "JavaScript bundle was not packaged into the release APK"
            exit 1
          }
          unzip -l "$APK_PATH" | grep -Eq 'mipmap|launcher' || {
            echo "Launcher branding was not packaged into the release APK"
            exit 1
          }

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ATEEK-RELEASE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-RELEASE-APK
          path: ATEEK-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
