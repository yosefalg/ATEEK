name: ATEEK Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, build3-ultra-ui, build4-global-1.6, spatial-social-1.8]
    paths-ignore: ['assets/generated/**']
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and verify ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png && test -s assets/generated/adaptive-icon.png && test -s assets/generated/splash.png
          file assets/generated/icon.png | grep -q 'PNG image data'
      - name: Persist generated branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if ! git diff --cached --quiet; then git commit -m "Generate ATEEK app branding assets" && git push; fi
      - name: Embed exact build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} Global (#${VERSION_CODE}) commit ${SHORT_SHA}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply Run 57 visual alignment refinement
        run: node scripts/run57-visual-refinement.mjs
      - name: Validate ATEEK Global v2 Run 57 release contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.0.0'||a.android.versionCode!==14)process.exit(1)"
          node -e "const p=require('./package.json');if(p.version!=='2.0.0'||p.dependencies['expo-video']!=='~3.0.16'||p.dependencies['react-native-safe-area-context']!=='~5.6.0')process.exit(1)"
          grep -Fq "itemVisiblePercentThreshold:80" src/components/SpatialReelsHub.tsx
          grep -Fq "numberOfLines={2}" src/components/SpatialReelsHub.tsx
          grep -Fq "bottom:insets.bottom+80" src/components/SpatialReelsHub.tsx
          grep -Fq "maxWidth: '78%'" src/components/SpatialDealScreens.tsx
          grep -Fq "paddingTop: 64" src/components/SpatialDealScreens.tsx
          grep -Fq "height: 56" src/components/SpatialDealScreens.tsx
          grep -Fq "width: 24" src/components/SpatialProfileAnalyticsHub.tsx
          grep -Fq "borderRadius: 16" src/components/SpatialProfileAnalyticsHub.tsx
          grep -Fq "get_user_analytics_v2" supabase/migrations/20260906160000_ateek_global_v2.sql
          test "$(node -e "const s=require('fs').readFileSync('src/data/seed.ts','utf8');process.stdout.write(/seedListings:\s*Listing\[\]\s*=\s*\[\s*\]/s.test(s)?'ok':'bad')")" = "ok"
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify final APK build identity
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          EXPECTED_VERSION_NAME="2.0.0"
          EXPECTED_VERSION_CODE="14"
          EXPECTED_SHORT_SHA="${GITHUB_SHA::7}"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
          [ "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME" ]
          [ "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE" ]
          BUNDLE_PATH="$(unzip -Z1 "$APK_PATH" | grep -E '^assets/(index\.android\.bundle|.*\.hbc)$' | head -n 1)"
          unzip -p "$APK_PATH" "$BUNDLE_PATH" > /tmp/ateek-runtime.bundle
          if strings /tmp/ateek-runtime.bundle | grep -Fq "$EXPECTED_SHORT_SHA"; then echo "Commit SHA located in runtime bundle strings: $EXPECTED_SHORT_SHA"; else grep -Fq "shortSha: '${EXPECTED_SHORT_SHA}'" src/config/buildInfo.ts; fi
          echo "VERIFIED FINAL APK: ${ACTUAL_VERSION_NAME} ATEEK Global #${ACTUAL_VERSION_CODE} ${EXPECTED_SHORT_SHA}"
          sha256sum "$APK_PATH"
      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ATEEK-RELEASE.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-RELEASE-APK
          path: ATEEK-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
