name: Unpack ATEEK archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-ateek.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive into repository root
        run: |
          rm -rf /tmp/ateek-unpack
          mkdir -p /tmp/ateek-unpack
          unzip -q ATEEK-ONLINE-FINAL.zip -d /tmp/ateek-unpack
          if [ -d /tmp/ateek-unpack/ATEEK ]; then
            cp -a /tmp/ateek-unpack/ATEEK/. ./
          else
            cp -a /tmp/ateek-unpack/. ./
          fi
          rm -f ATEEK-ONLINE-FINAL.zip
          rm -f .github/workflows/build-apk.yml

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack ATEEK project files"
            git push
          fi
