name: ATEEK Android Production

on:
  workflow_dispatch:
  push:
    branches: [production-ready-2.1]
    paths-ignore: ['assets/generated/**']
permissions:
  contents: write
jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and verify ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png && test -s assets/generated/adaptive-icon.png && test -s assets/generated/splash.png
      - name: Embed exact build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} Play (#${VERSION_CODE}) commit ${SHORT_SHA}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.1.0'||a.android.versionCode!==15)process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='app-bundle'||e.build.production.distribution!=='store')process.exit(1)"
          grep -Fq "ScreenErrorBoundary name=\"Chat\"" src/cloud/OnlineApp.tsx
          grep -Fq "SafeReelVideo" src/components/SpatialReelsHub.tsx
          grep -Fq "ateek_verification_request_submit" supabase/migrations/20260906193000_production_ready_v21.sql
          grep -Fq "#090A0F" src/theme/tokens.ts
          test "$(node -e "const s=require('fs').readFileSync('src/data/seed.ts','utf8');process.stdout.write(/seedListings:\s*Listing\[\]\s*=\s*\[\s*\]/s.test(s)?'ok':'bad')")" = "ok"
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build Play AAB and verification APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Verify exact Android identity
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          EXPECTED_VERSION_NAME="2.1.0"
          EXPECTED_VERSION_CODE="15"
          EXPECTED_SHORT_SHA="${GITHUB_SHA::7}"
          test -s "$APK_PATH" && test -s "$AAB_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -t "$AAB_PATH" >/dev/null
          unzip -Z1 "$AAB_PATH" | grep -q '^base/manifest/AndroidManifest.xml$'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
          [ "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME" ]
          [ "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE" ]
          BUNDLE_PATH="$(unzip -Z1 "$APK_PATH" | grep -E '^assets/(index\.android\.bundle|.*\.hbc)$' | head -n 1)"
          unzip -p "$APK_PATH" "$BUNDLE_PATH" > /tmp/ateek-runtime.bundle
          strings /tmp/ateek-runtime.bundle | grep -Fq "$EXPECTED_SHORT_SHA" || grep -Fq "shortSha: '${EXPECTED_SHORT_SHA}'" src/config/buildInfo.ts
          echo "VERIFIED PLAY CANDIDATE: ${ACTUAL_VERSION_NAME} #${ACTUAL_VERSION_CODE} ${EXPECTED_SHORT_SHA}"
          sha256sum "$AAB_PATH" "$APK_PATH"
      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ATEEK-PLAY-RELEASE.aab
          cp android/app/build/outputs/apk/release/app-release.apk ATEEK-2.1.0-BUILD15.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-PLAY-AAB
          path: ATEEK-PLAY-RELEASE.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-INSTALLABLE-APK
          path: ATEEK-2.1.0-BUILD15.apk
          if-no-files-found: error
          retention-days: 30
