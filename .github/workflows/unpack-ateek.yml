name: ATEEK Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify JS bundle is packaged
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          unzip -l "$APK_PATH" | grep -Eq 'index\.android\.bundle|assets/.+\.bundle' || {
            echo "JavaScript bundle was not packaged into the release APK"
            exit 1
          }

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ATEEK-RELEASE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-RELEASE-APK
          path: ATEEK-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
