name: ATEEK Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, build3-ultra-ui]
    paths-ignore: ['assets/generated/**']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and verify ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png && test -s assets/generated/adaptive-icon.png && test -s assets/generated/splash.png
          file assets/generated/icon.png | grep -q 'PNG image data'
      - name: Persist generated branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if ! git diff --cached --quiet; then git commit -m "Generate ATEEK app branding assets" && git push; fi
      - name: Embed exact build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} (#${VERSION_CODE}) commit ${SHORT_SHA}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Validate production Android bundle
        run: npx expo export --platform android --output-dir dist-ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify final APK build identity
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          EXPECTED_VERSION_NAME=$(node -p "require('./app.json').expo.version")
          EXPECTED_VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          EXPECTED_SHORT_SHA="${GITHUB_SHA::7}"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -l "$APK_PATH" | grep -q 'assets/index.android.bundle'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          BADGING=$("$AAPT" dump badging "$APK_PATH" | head -n 1)
          ACTUAL_VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          ACTUAL_VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          unzip -p "$APK_PATH" assets/index.android.bundle > /tmp/ateek-index.android.bundle
          grep -aFq "$EXPECTED_SHORT_SHA" /tmp/ateek-index.android.bundle
          grep -aFq "$EXPECTED_VERSION_NAME" /tmp/ateek-index.android.bundle
          echo "VERIFIED FINAL APK: ${ACTUAL_VERSION_NAME} #${ACTUAL_VERSION_CODE} ${EXPECTED_SHORT_SHA}"
          sha256sum "$APK_PATH"
      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk ATEEK-RELEASE.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-RELEASE-APK
          path: ATEEK-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
