name: ATEEK Android Production APK

on:
  workflow_dispatch:
  push:
    branches: [production-ready-2.1]
    paths-ignore: ['assets/generated/**']

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and verify ATEEK branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin openssl
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png
          test -s assets/generated/adaptive-icon.png
          test -s assets/generated/splash.png

      - name: Embed exact build identity
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > src/config/buildInfo.ts <<EOF
          export const BUILD_INFO = { versionName: '${VERSION_NAME}', versionCode: ${VERSION_CODE}, shortSha: '${SHORT_SHA}' } as const;
          EOF
          echo "Embedding ATEEK ${VERSION_NAME} (#${VERSION_CODE}) commit ${SHORT_SHA}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Run 74 Reels SWR and RTL transform
        run: |
          node scripts/run74-reels-transform.mjs
          grep -Fq 'readReelsSnapshot' src/components/SpatialReelsHub.tsx
          grep -Fq 'inverted={isRTL}' src/components/SpatialReelsHub.tsx

      - name: Apply Run 76 contextual AI transform
        run: |
          node scripts/run76-reels-transform.mjs
          grep -Fq 'ai-translate' src/components/SpatialReelsHub.tsx
          grep -Fq 'thumbnail_url' src/components/SpatialReelsHub.tsx

      - name: Apply production transforms through Run 98
        run: |
          node scripts/run77-reels-transform.mjs
          grep -Fq 'initialNumToRender={1} maxToRenderPerBatch={1}' src/components/SpatialReelsHub.tsx
          ! grep -Fq 'nextReel=' src/components/SpatialReelsHub.tsx
          ! grep -Fq 'onSkip=' src/components/SpatialReelsHub.tsx
          grep -Fq 'const sendImage = async' src/components/SpatialDealScreens.tsx
          grep -Fq 'requestMediaLibraryPermissionsAsync' src/components/SpatialDealScreens.tsx
          grep -Fq 'ateek_profile_social_update' src/components/SpatialProfileAnalyticsHub.tsx
          grep -Fq 'formatAiForArabic' src/components/SpatialDealScreens.tsx
          grep -Fq 'duration:260' src/cloud/OnlineApp.tsx
          ! grep -Fq 'opacity.value=0' src/cloud/OnlineApp.tsx
          grep -Fq "justifyContent: 'flex-end'" src/components/SpatialDealScreens.tsx
          ! grep -Fq 'الملاحظات الصوتية غير مفعلة لهذه المحادثة' src/components/SpatialDealScreens.tsx
          grep -Fq 'مركز المحادثات' src/components/SpatialDealScreens.tsx
          grep -Fq 'BUILD_INFO.versionName' src/components/SpatialProfileAnalyticsHub.tsx
          grep -Fq 'AuthPortal' src/cloud/OnlineApp.tsx
          grep -Fq 'عتيك بلس' src/components/ProductionAccountHub.tsx

      - name: Validate production contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.1.0'||a.android.versionCode!==15||a.jsEngine!=='hermes'||a.android.softwareKeyboardLayoutMode!=='resize')process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='apk'||e.build.production.distribution!=='internal')process.exit(1)"
          grep -Fq 'ConsentManager' src/AppShell.tsx
          grep -Fq "id:'notifications'" src/components/BottomNav.tsx
          grep -Fq 'quickGrid' src/screens/HomeScreen.tsx
          grep -Fq 'أحدث الإعلانات' src/screens/HomeScreen.tsx
          grep -Fq 'أحدث الريلز' src/screens/HomeScreen.tsx
          grep -Fq 'Gyroscope' src/components/DynamicBackground.tsx
          grep -Fq 'LinearGradient' src/components/DynamicBackground.tsx
          grep -Fq 'VIDEO_READY_TIMEOUT_2000MS' src/components/SafeReelVideo.tsx
          grep -Fq 'cloudinaryVideoThumbnail' src/components/SafeReelVideo.tsx
          grep -Fq 'VIDEO_SOURCE_INVALID_OR_MISSING' src/components/SafeReelVideo.tsx
          grep -Fq 'replaceAsync' src/components/SafeReelVideo.tsx
          grep -Fq 'ateek_client_error_log' src/components/SafeReelVideo.tsx
          grep -Fq 'AsyncStorage.multiGet' src/theme/ThemeProvider.tsx
          grep -Fq 'drop_console' metro.config.js
          grep -Fq "behavior={Platform.OS === 'ios' ? 'padding' : 'height'}" src/screens/AddListingScreen.tsx
          grep -Fq "behavior={isIOS?'padding':'height'}" src/AppShell.tsx
          grep -Fq 'accessibilityLiveRegion="polite"' src/screens/AddListingScreen.tsx
          grep -Fq 'const canPublish = Boolean' src/screens/AddListingScreen.tsx
          grep -Fq 'AsyncStorage.removeItem(DRAFT_KEY)' src/screens/AddListingScreen.tsx

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run i18n quality gate
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Validate production Android JS bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Apply native hardening and enforce adjustResize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=Path('android/app/src/main/res/xml/network_security_config.xml')
          gradle=Path('android/app/build.gradle')
          props=Path('android/gradle.properties')

          s=manifest.read_text()
          s=re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"','',s)
          s=re.sub(r'\sandroid:networkSecurityConfig="[^"]*"','',s)
          s=re.sub(r'android:windowSoftInputMode="[^"]*"','android:windowSoftInputMode="adjustResize"',s)
          s=s.replace('<application','<application android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config"',1)
          manifest.write_text(s)

          xml.parent.mkdir(parents=True,exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n')

          p=props.read_text()
          p=re.sub(r'^android\.bundle\.enableUncompressedNativeLibs=.*\n?','',p,flags=re.M)
          props.write_text(p)

          g=gradle.read_text()
          if 'hermesFlags = ["-O", "-output-source-map"]' not in g:
              g=g.replace('react {','react {\n    hermesFlags = ["-O", "-output-source-map"]',1)
          marker='android {'
          block='''android {\n    packagingOptions {\n        jniLibs {\n            pickFirsts += ["**/libc++_shared.so"]\n            excludes += ["**/libjsc.so", "**/libjscexecutor.so"]\n        }\n    }'''
          if 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' not in g:
              g=g.replace(marker,block,1)
          gradle.write_text(g)
          PY
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq '<certificates src="system" />' android/app/src/main/res/xml/network_security_config.xml
          grep -Fq 'hermesFlags = ["-O", "-output-source-map"]' android/app/build.gradle
          grep -Eq 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml

      - name: Build arm64 installable APK only
        env:
          IS_INSTALLABLE_APK: 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify exact Android identity and ABI contract
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          echo "$BADGING" | grep -Eq "versionCode='15'.*versionName='2\.1\.0'|versionName='2\.1\.0'.*versionCode='15'"
          APK_ABIS="$(unzip -Z1 "$APK_PATH" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          [ "$APK_ABIS" = "arm64-v8a " ]
          ! unzip -Z1 "$APK_PATH" | grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$'
          echo "VERIFIED APK-ONLY: 2.1.0 #15 ${GITHUB_SHA::7}"
          sha256sum "$APK_PATH"

      - name: Generate APK size metrics and enforce budget
        run: |
          set -euo pipefail
          mkdir -p metrics-out
          python - <<'PY'
          import gzip,json,os,zipfile
          apk='android/app/build/outputs/apk/release/app-release.apk'
          base={'apkBytes':31781180,'dexRawBytes':23846736,'dexCompressedBytes':9010803,'hermesRawBytes':2947888,'hermesGzipBytes':1403800}
          with zipfile.ZipFile(apk) as z:
              infos=z.infolist()
              dex=[i for i in infos if i.filename.startswith('classes') and i.filename.endswith('.dex')]
              dex_raw=sum(i.file_size for i in dex)
              dex_comp=sum(i.compress_size for i in dex)
              arm=sum(i.file_size for i in infos if i.filename.startswith('lib/arm64-v8a/'))
              js=None
              for i in infos:
                  if i.filename.startswith('assets/') and ('index.android.bundle' in i.filename or i.filename.endswith('.hbc')):
                      data=z.read(i.filename)
                      js={'bytes':len(data),'gzipBytes':len(gzip.compress(data,9))}
                      break
          now={'apkBytes':os.path.getsize(apk),'dexRawBytes':dex_raw,'dexCompressedBytes':dex_comp,'arm64NativeRawBytes':arm,'hermes':js}
          delta={k:now[k]-base[k] for k in ('apkBytes','dexRawBytes','dexCompressedBytes')}
          out={'baseline':base,'current':now,'delta':delta,'apkTargetBytes':50*1024*1024,'artifactMode':'apk-only-arm64'}
          open('metrics-out/RUN-METRICS.json','w').write(json.dumps(out,indent=2))
          lines=['ATEEK APK-ONLY PRODUCTION METRICS',f"APK bytes={now['apkBytes']} delta_vs_baseline={delta['apkBytes']}",f"DEX raw={dex_raw} delta={delta['dexRawBytes']}",f"DEX compressed={dex_comp} delta={delta['dexCompressedBytes']}",f"arm64 native raw={arm}",f"Hermes raw={js['bytes'] if js else 'n/a'} gzip={js['gzipBytes'] if js else 'n/a'}",'AAB production: DISABLED in this workflow.','Physical Android device test/screenshots/battery measurement: NOT PERFORMED by this CI runner.']
          open('metrics-out/METRICS.txt','w').write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          if delta['dexCompressedBytes']>1_000_000: raise SystemExit(f'DEX compressed growth exceeds 1MB guard: {delta["dexCompressedBytes"]}')
          if now['apkBytes']>50*1024*1024: raise SystemExit(f'APK exceeds 50 MiB target: {now["apkBytes"]}')
          PY
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK_ANALYZER" ]; then
            {
              echo '=== APK SUMMARY ==='
              "$APK_ANALYZER" apk summary android/app/build/outputs/apk/release/app-release.apk || true
              echo '=== APK FILES ==='
              "$APK_ANALYZER" files list android/app/build/outputs/apk/release/app-release.apk || true
              echo '=== DEX PACKAGES ==='
              "$APK_ANALYZER" dex packages android/app/build/outputs/apk/release/app-release.apk || true
            } > metrics-out/APKANALYZER.txt
          else
            echo "apkanalyzer not found on runner" > metrics-out/APKANALYZER.txt
          fi

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-INSTALLABLE-APK-ARM64
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: ATEEK-PRODUCTION-METRICS
          path: metrics-out/*
          if-no-files-found: error
          retention-days: 30
