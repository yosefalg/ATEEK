name: ATEEK 2.2 Staging APK

on:
  push:
    branches: ['staging-*']
    paths-ignore: ['assets/generated/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ateek-2.2-staging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin openssl
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png
          test -s assets/generated/adaptive-icon.png
          test -s assets/generated/splash.png

      - name: Verify release contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.2.0'||a.android.versionCode!==16||a.jsEngine!=='hermes'||a.android.softwareKeyboardLayoutMode!=='resize')process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='apk'||e.build.production.distribution!=='internal')process.exit(1)"

      - name: Verify lockfile contract
        run: |
          node - <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const root=l.packages?.[''];
          if(!root) throw new Error('lockfile root package missing');
          if(l.name!==p.name||root.name!==p.name) throw new Error('lockfile name mismatch');
          if(l.version!==p.version||root.version!==p.version) throw new Error(`lockfile version mismatch: ${l.version}/${root.version} vs ${p.version}`);
          for(const section of ['dependencies','devDependencies']){
            const a=p[section]||{}, b=root[section]||{};
            const mismatch=Object.keys(a).filter(k=>b[k]!==a[k]);
            const extra=Object.keys(b).filter(k=>!(k in a));
            if(mismatch.length||extra.length) throw new Error(`${section} mismatch changed=${mismatch.join(',')} extra=${extra.join(',')}`);
          }
          NODE

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Apply production transforms
        run: |
          node scripts/run74-reels-transform.mjs
          node scripts/run76-reels-transform.mjs
          node scripts/run77-reels-transform.mjs

      - name: Static validation
        run: |
          npm run typecheck
          npm run i18n:check
          npm test
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Apply native hardening and adjustResize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=Path('android/app/src/main/res/xml/network_security_config.xml')
          gradle=Path('android/app/build.gradle')
          props=Path('android/gradle.properties')
          s=manifest.read_text()
          s=re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"','',s)
          s=re.sub(r'\sandroid:networkSecurityConfig="[^"]*"','',s)
          s=re.sub(r'android:windowSoftInputMode="[^"]*"','android:windowSoftInputMode="adjustResize"',s)
          s=s.replace('<application','<application android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config"',1)
          manifest.write_text(s)
          xml.parent.mkdir(parents=True,exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n')
          p=props.read_text()
          p=re.sub(r'^android\.bundle\.enableUncompressedNativeLibs=.*\n?','',p,flags=re.M)
          p=re.sub(r'^org\.gradle\.jvmargs=.*\n?','',p,flags=re.M)
          p=p.rstrip()+"\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n"
          props.write_text(p)
          g=gradle.read_text()
          if 'hermesFlags = ["-O", "-output-source-map"]' not in g:
              g=g.replace('react {','react {\n    hermesFlags = ["-O", "-output-source-map"]',1)
          if 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' not in g:
              g=g.replace('android {','android {\n    packagingOptions {\n        jniLibs {\n            pickFirsts += ["**/libc++_shared.so"]\n            excludes += ["**/libjsc.so", "**/libjscexecutor.so"]\n        }\n    }',1)
          g,n=re.subn(r'(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)\s*signingConfig\s+signingConfigs\.debug',r'\1',g,count=1)
          if n != 1:
              raise SystemExit('Could not replace generated release debug signing config')
          gradle.write_text(g)
          PY
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Eq 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' android/gradle.properties
          grep -Fq 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' android/app/build.gradle
          ! grep -Eq 'release[[:space:]]*\{[\s\S]*signingConfig[[:space:]]+signingConfigs\.debug' android/app/build.gradle

      - name: Compile unsigned arm64 release for native validation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify unsigned native validation APK
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH")"
          PACKAGE_LINE="${BADGING%%$'\n'*}"
          grep -Fq "package: name='com.yosef.ateek'" <<< "$PACKAGE_LINE"
          grep -Eq "versionCode='16'.*versionName='2\.2\.0'|versionName='2\.2\.0'.*versionCode='16'" <<< "$PACKAGE_LINE"
          ! grep -q '^application-debuggable' <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK_PATH")"
          APK_ABIS="$(printf '%s\n' "$APK_ENTRIES" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          [ "$APK_ABIS" = "arm64-v8a " ]
          ! grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$' <<< "$APK_ENTRIES"
          APK_BYTES=$(stat -c%s "$APK_PATH")
          [ "$APK_BYTES" -le $((35*1024*1024)) ]
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo '::error title=Unexpected signer::Native validation APK must remain unsigned before the release-signing gate'
            exit 1
          fi
          echo "Unsigned native release validation passed: $APK_PATH ($APK_BYTES bytes)"
          rm -f android/app/build/outputs/apk/release/*.apk

      - name: Validate release signing material
        env:
          ATEEK_ANDROID_KEYSTORE_B64: ${{ secrets.ATEEK_ANDROID_KEYSTORE_B64 }}
          ATEEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATEEK_ANDROID_KEYSTORE_PASSWORD }}
          ATEEK_ANDROID_KEY_ALIAS: ${{ secrets.ATEEK_ANDROID_KEY_ALIAS }}
          ATEEK_ANDROID_KEY_PASSWORD: ${{ secrets.ATEEK_ANDROID_KEY_PASSWORD }}
          ATEEK_ANDROID_CERT_SHA256: ${{ secrets.ATEEK_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for var in ATEEK_ANDROID_KEYSTORE_B64 ATEEK_ANDROID_KEYSTORE_PASSWORD ATEEK_ANDROID_KEY_ALIAS ATEEK_ANDROID_KEY_PASSWORD ATEEK_ANDROID_CERT_SHA256; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing release signing secret::$var is required for a production-grade release APK"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          EXPECTED_CERT="$(printf '%s' "$ATEEK_ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$ATEEK_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ateek-release.keystore"
          test -s "$RUNNER_TEMP/ateek-release.keystore"
          chmod 600 "$RUNNER_TEMP/ateek-release.keystore"
          echo "ATEEK_KEYSTORE_PATH=$RUNNER_TEMP/ateek-release.keystore" >> "$GITHUB_ENV"

      - name: Inject pinned release signing config
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('android/app/build.gradle')
          g=gradle.read_text()
          signing='''    signingConfigs {\n        release {\n            storeFile file(System.getenv("ATEEK_KEYSTORE_PATH"))\n            storePassword System.getenv("ATEEK_ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ATEEK_ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ATEEK_ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
          if 'ATEEK_KEYSTORE_PATH' in g:
              raise SystemExit('Release signing config already present before secret validation')
          g=g.replace('    buildTypes {', signing+'\n    buildTypes {', 1)
          g,n=re.subn(r'(buildTypes\s*\{[\s\S]*?release\s*\{)',r'\1\n            signingConfig signingConfigs.release',g,count=1)
          if n != 1 or 'signingConfig signingConfigs.release' not in g or 'ATEEK_KEYSTORE_PATH' not in g:
              raise SystemExit('Release signing injection failed')
          gradle.write_text(g)
          PY
          grep -Fq 'signingConfig signingConfigs.release' android/app/build.gradle
          grep -Fq 'ATEEK_KEYSTORE_PATH' android/app/build.gradle

      - name: Build arm64 staging APK only
        env:
          ATEEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATEEK_ANDROID_KEYSTORE_PASSWORD }}
          ATEEK_ANDROID_KEY_ALIAS: ${{ secrets.ATEEK_ANDROID_KEY_ALIAS }}
          ATEEK_ANDROID_KEY_PASSWORD: ${{ secrets.ATEEK_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify staging APK
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH")"
          PACKAGE_LINE="${BADGING%%$'\n'*}"
          grep -Fq "package: name='com.yosef.ateek'" <<< "$PACKAGE_LINE"
          grep -Eq "versionCode='16'.*versionName='2\.2\.0'|versionName='2\.2\.0'.*versionCode='16'" <<< "$PACKAGE_LINE"
          ! grep -q '^application-debuggable' <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK_PATH")"
          APK_ABIS="$(printf '%s\n' "$APK_ENTRIES" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          [ "$APK_ABIS" = "arm64-v8a " ]
          ! grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$' <<< "$APK_ENTRIES"
          APK_BYTES=$(stat -c%s "$APK_PATH")
          [ "$APK_BYTES" -le $((35*1024*1024)) ]
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          mkdir -p metrics-out
          printf 'APK bytes=%s\nSHA-256=%s\nABI=arm64-v8a\nPackage=com.yosef.ateek\nVersion=2.2.0\nVersionCode=16\nDebuggable=NO\nAAB=DISABLED\nPhysical Android device test=NOT PERFORMED BY CI\n' "$APK_BYTES" "$SHA" > metrics-out/METRICS.txt
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 -print -quit 2>/dev/null)"
          test -n "$APK_ANALYZER"
          "$APK_ANALYZER" apk summary "$APK_PATH" > metrics-out/APKANALYZER.txt
          grep -Fq 'com.yosef.ateek' metrics-out/APKANALYZER.txt
          cat metrics-out/METRICS.txt

      - name: Verify APK signer identity
        env:
          ATEEK_ANDROID_CERT_SHA256: ${{ secrets.ATEEK_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee metrics-out/APKSIGNER.txt
          grep -Eq '^Number of signers: 1$' metrics-out/APKSIGNER.txt
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme .*: true$' metrics-out/APKSIGNER.txt
          ! grep -Eqi 'certificate DN: .*CN=Android Debug|certificate DN: CN=Android Debug' metrics-out/APKSIGNER.txt
          CERT_SHA256="$(awk '
            /^Signer #[0-9]+ certificate SHA-256 digest: / { sub(/^.*digest: /, ""); print; exit }
            /^V[0-9.]+ Signer: certificate SHA-256 digest: / { sub(/^.*digest: /, ""); print; exit }
          ' metrics-out/APKSIGNER.txt | tr -d '\r')"
          ACTUAL="$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$ATEEK_ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$ACTUAL" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error title=Release signer mismatch::APK signer certificate does not match the pinned production certificate'
            exit 1
          fi
          printf 'Signer certificate SHA-256=%s\n' "$ACTUAL" >> metrics-out/METRICS.txt
          test -s metrics-out/APKSIGNER.txt

      - name: Prepare artifacts
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload staging APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ATEEK-2.2-STAGING-APK-ARM64
          path: app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload staging metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ATEEK-2.2-STAGING-METRICS
          path: metrics-out/*
          if-no-files-found: error
          retention-days: 7
