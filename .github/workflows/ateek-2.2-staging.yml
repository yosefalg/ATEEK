name: ATEEK 2.2 Staging APK

on:
  push:
    branches: ['staging-*']
    paths-ignore: ['assets/generated/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ateek-2.2-staging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      CI: true
      ATEEK_RELEASE_KEYSTORE_B64: ${{ secrets.ATEEK_RELEASE_KEYSTORE_B64 }}
      ATEEK_RELEASE_STORE_PASSWORD: ${{ secrets.ATEEK_RELEASE_STORE_PASSWORD }}
      ATEEK_RELEASE_KEY_ALIAS: ${{ secrets.ATEEK_RELEASE_KEY_ALIAS }}
      ATEEK_RELEASE_KEY_PASSWORD: ${{ secrets.ATEEK_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate branded assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin openssl
          mkdir -p assets/generated
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1024 -h 1024 -o assets/generated/adaptive-icon.png
          rsvg-convert assets/brand/ateek-mark.svg -w 1536 -h 1536 -o assets/generated/splash.png
          test -s assets/generated/icon.png
          test -s assets/generated/adaptive-icon.png
          test -s assets/generated/splash.png

      - name: Verify release contract
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='2.2.0'||a.android.versionCode!==16||a.jsEngine!=='hermes'||a.android.softwareKeyboardLayoutMode!=='resize')process.exit(1)"
          node -e "const e=require('./eas.json');if(e.build.production.android.buildType!=='apk'||e.build.production.distribution!=='internal')process.exit(1)"

      - name: Verify lockfile contract
        run: |
          node - <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const root=l.packages?.[''];
          if(!root) throw new Error('lockfile root package missing');
          if(l.name!==p.name||root.name!==p.name) throw new Error('lockfile name mismatch');
          if(l.version!==p.version||root.version!==p.version) throw new Error(`lockfile version mismatch: ${l.version}/${root.version} vs ${p.version}`);
          for(const section of ['dependencies','devDependencies']){
            const a=p[section]||{}, b=root[section]||{};
            const mismatch=Object.keys(a).filter(k=>b[k]!==a[k]);
            const extra=Object.keys(b).filter(k=>!(k in a));
            if(mismatch.length||extra.length) throw new Error(`${section} mismatch changed=${mismatch.join(',')} extra=${extra.join(',')}`);
          }
          NODE

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Apply production transforms
        run: |
          node scripts/run74-reels-transform.mjs
          node scripts/run76-reels-transform.mjs
          node scripts/run77-reels-transform.mjs

      - name: Static validation
        run: |
          npm run typecheck
          npm run i18n:check
          npm test
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-ci

      - name: Validate stable release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ATEEK_RELEASE_KEYSTORE_B64 ATEEK_RELEASE_STORE_PASSWORD ATEEK_RELEASE_KEY_ALIAS ATEEK_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/ateek-release.keystore"
          printf '%s' "$ATEEK_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ATEEK_RELEASE_STORE_PASSWORD" -alias "$ATEEK_RELEASE_KEY_ALIAS" >/dev/null
          echo "ATEEK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Apply native hardening and adjustResize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=Path('android/app/src/main/res/xml/network_security_config.xml')
          gradle=Path('android/app/build.gradle')
          props=Path('android/gradle.properties')
          s=manifest.read_text()
          s=re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"','',s)
          s=re.sub(r'\sandroid:networkSecurityConfig="[^"]*"','',s)
          s=re.sub(r'android:windowSoftInputMode="[^"]*"','android:windowSoftInputMode="adjustResize"',s)
          s=s.replace('<application','<application android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config"',1)
          manifest.write_text(s)
          xml.parent.mkdir(parents=True,exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n')
          p=props.read_text()
          p=re.sub(r'^android\.bundle\.enableUncompressedNativeLibs=.*\n?','',p,flags=re.M)
          p=re.sub(r'^org\.gradle\.jvmargs=.*\n?','',p,flags=re.M)
          p=p.rstrip()+"\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n"
          props.write_text(p)
          g=gradle.read_text()
          if 'hermesFlags = ["-O", "-output-source-map"]' not in g:
              g=g.replace('react {','react {\n    hermesFlags = ["-O", "-output-source-map"]',1)
          if 'excludes += ["**/libjsc.so", "**/libjscexecutor.so"]' not in g:
              g=g.replace('android {','android {\n    packagingOptions {\n        jniLibs {\n            pickFirsts += ["**/libc++_shared.so"]\n            excludes += ["**/libjsc.so", "**/libjscexecutor.so"]\n        }\n    }',1)
          gradle.write_text(g)
          PY
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Eq 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml

      - name: Build arm64 staging APK only
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Re-sign staging APK with stable release key
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNED_APK="$RUNNER_TEMP/ateek-release-signed.apk"
          "$APKSIGNER" sign \
            --ks "$ATEEK_RELEASE_KEYSTORE" \
            --ks-key-alias "$ATEEK_RELEASE_KEY_ALIAS" \
            --ks-pass env:ATEEK_RELEASE_STORE_PASSWORD \
            --key-pass env:ATEEK_RELEASE_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK_PATH"
          test -s "$SIGNED_APK"
          mv "$SIGNED_APK" "$APK_PATH"

      - name: Verify staging APK
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK_PATH" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_PATH")"
          PACKAGE_LINE="${BADGING%%$'\n'*}"
          grep -Fq "package: name='com.yosef.ateek'" <<< "$PACKAGE_LINE"
          grep -Eq "versionCode='16'.*versionName='2\.2\.0'|versionName='2\.2\.0'.*versionCode='16'" <<< "$PACKAGE_LINE"
          ! grep -q '^application-debuggable' <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK_PATH")"
          APK_ABIS="$(printf '%s\n' "$APK_ENTRIES" | awk -F/ '/^lib\//{print $2}' | sort -u | tr '\n' ' ')"
          [ "$APK_ABIS" = "arm64-v8a " ]
          ! grep -qE '^lib/arm64-v8a/lib(jsc|jscexecutor)\.so$' <<< "$APK_ENTRIES"
          APK_BYTES=$(stat -c%s "$APK_PATH")
          [ "$APK_BYTES" -le $((35*1024*1024)) ]
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          mkdir -p metrics-out
          printf 'APK bytes=%s\nSHA-256=%s\nABI=arm64-v8a\nPackage=com.yosef.ateek\nVersion=2.2.0\nVersionCode=16\nDebuggable=NO\nAAB=DISABLED\nPhysical Android device test=NOT PERFORMED BY CI\n' "$APK_BYTES" "$SHA" > metrics-out/METRICS.txt
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 -print -quit 2>/dev/null)"
          test -n "$APK_ANALYZER"
          {
            echo '=== APK SUMMARY ==='
            "$APK_ANALYZER" apk summary "$APK_PATH"
            echo '=== APK FILES ==='
            "$APK_ANALYZER" files list "$APK_PATH"
            echo '=== DEX PACKAGES ==='
            "$APK_ANALYZER" dex packages "$APK_PATH"
          } > metrics-out/APKANALYZER.txt
          grep -Fq '=== APK SUMMARY ===' metrics-out/APKANALYZER.txt
          grep -Fq 'com.yosef.ateek' metrics-out/APKANALYZER.txt
          grep -Eq '(^|[[:space:]])16([[:space:]]|$)' metrics-out/APKANALYZER.txt
          grep -Fq '2.2.0' metrics-out/APKANALYZER.txt
          grep -Fq '=== APK FILES ===' metrics-out/APKANALYZER.txt
          grep -Fq '=== DEX PACKAGES ===' metrics-out/APKANALYZER.txt
          cat metrics-out/METRICS.txt

      - name: Verify APK signer and reject debug certificates
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee metrics-out/APKSIGNER.txt
          grep -Eq '^Number of signers: 1$' metrics-out/APKSIGNER.txt
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme .*: true$' metrics-out/APKSIGNER.txt
          if grep -Eqi 'certificate DN: .*CN=Android Debug|certificate DN: CN=Android Debug' metrics-out/APKSIGNER.txt; then
            echo 'Refusing release APK signed with Android Debug certificate'
            exit 1
          fi
          CERT_SHA256="$(awk '
            /^Signer #[0-9]+ certificate SHA-256 digest: / { sub(/^.*digest: /, ""); print; exit }
            /^V[0-9.]+ Signer: certificate SHA-256 digest: / { sub(/^.*digest: /, ""); print; exit }
          ' metrics-out/APKSIGNER.txt | tr -d '\r')"
          test -n "$CERT_SHA256"
          printf 'Signer certificate SHA-256=%s\n' "$CERT_SHA256" >> metrics-out/METRICS.txt
          test -s metrics-out/APKSIGNER.txt

      - name: Prepare artifacts
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload staging APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ATEEK-2.2-STAGING-APK-ARM64
          path: app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload staging metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ATEEK-2.2-STAGING-METRICS
          path: metrics-out/*
          if-no-files-found: error
          retention-days: 7
